name: App release

# Tags and publishes a version when crosspad-app.json's version changes; the
# logic is CrossPad/.github's reusable app-release.yml (no bot key here: the
# announcer relays app-released to crosspad-apps after the release is published).
on:
  push:
    branches: [main]
    paths: [crosspad-app.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  release:
    uses: CrossPad/.github/.github/workflows/app-release.yml@v1
    with:
      runner: ${{ vars.CROSSPAD_LIGHT_RUNNER || 'crosspad-light' }}
